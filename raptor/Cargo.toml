[package]
name = "raptor"
version = "0.1.0"
edition = "2024"
authors = ["Denis Kuzmin denis1331.kuzmin@gmail.com"]
description = "High-performance in-memory key-value store written in Rust"
license = "MIT"
homepage = "https://github.com/Denint/Raptor"
repository = "https://github.com/Denint/Raptor"
keywords = ["key-value", "in-memory", "database", "cache"]
categories = ["database", "data-structures", "web-programming"]

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1.77"
dashmap = "5.5.3"
tokio = { version = "1.37.0", features = ["full"] }
axum = { version = "0.7.5", features = ["json", "http2"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
dotenvy = "0.15.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
base64 = "0.22.1"
reqwest = { version = "0.12.4", features = ["json"], optional = true }
rand = { version = "0.8", features = ["std_rng"], optional = true }
once_cell = "1.19.0"
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3.3"
tracing-appender = "0.2.2"
metrics = "0.22.0"


[dev-dependencies]
mockall = "0.12.1"
reqwest = { version = "0.12.4", features = ["json"] }
criterion = "0.5.1"
once_cell = "1.19.0"
serde_json = "1.0"
base64 = "0.22.1"
futures = "0.3"
rand = { version = "0.8", features = ["std_rng"] }
fastrand = "2.0"
tokio = { version = "1.37.0", features = ["full"] }

[[bin]]
name = "raptor"
test = false

[lib]
doctest = false
