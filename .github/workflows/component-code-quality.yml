---
name: Code Quality Checks

on:
  workflow_call:
    inputs:
      run_audit:
        description: 'Run security audit'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: ${{ runner.os }}-rust-toolchain-${{
            hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-toolchain-

      - name: Apply formatting (cargo fmt)
        run: cargo fmt --all

      - name: Apply automatic fixes (cargo fix)
        run: cargo fix --allow-dirty --allow-staged

      - name: Apply clippy fixes
        run: cargo clippy --fix --allow-dirty --allow-staged -- -D warnings

      - name: Final formatting check
        run: cargo fmt --all -- --check

      - name: Commit all fixes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .

            git pull --rebase origin ${{ github.ref_name }} || {
              echo "Rebase failed, trying merge..."
              git pull origin ${{ github.ref_name }} || {
                echo "Pull failed, forcing push..."
                git push --force-with-lease
                exit 0
              }
            }

            git commit -m "🤖 Auto-fix: format, clippy, and fix applied"

            if git push; then
              echo "Successfully pushed changes"
            else
              echo "Normal push failed, trying force push..."
              git push --force-with-lease || {
                echo "Force push also failed!"
                echo "Manual intervention required"
                exit 1
              }
            fi
          else
            echo "No changes needed"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{
            hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --verbose

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    if: inputs.run_audit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{
            hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit
          fi

      - name: Run security audit
        run: cargo audit
