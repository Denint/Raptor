  benchmark-complex-scenarios:
    name: Complex Scenarios Benchmarks (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario: [mixed_workload, complex_queries]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
