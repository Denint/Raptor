---
name: Miri Memory Safety Checks

on:
  workflow_call:
    inputs:
      run_miri:
        description: 'Run Miri checks'
        type: boolean
        default: true
      miri_flags:
        description: 'Additional Miri flags'
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MIRIFLAGS: ${{ inputs.miri_flags || '-Zmiri-disable-isolation -Zmiri-permissive-provenance -Zmiri-strict-provenance' }}

jobs:
  miri-check:
    name: Miri Memory Safety Analysis
    runs-on: ubuntu-latest
    if: inputs.run_miri
    steps:
      - uses: actions/checkout@v4

      - name: Setup nightly Rust with Miri
        run: |
          rustup update nightly
          rustup default nightly
          rustup component add miri
          rustup component add rust-src

      - name: Cache Miri toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/nightly-*
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-nightly-

      - name: Setup Miri
        run: |
          cargo miri setup
          cargo miri --version

      - name: Run Miri tests (basic)
        run: |
          cargo miri test --lib
        continue-on-error: false

      - name: Run Miri tests (bins and examples)
        run: |
          cargo miri test --bins --examples
        continue-on-error: false

      - name: Run Miri with custom flags (if provided)
        if: inputs.miri_flags != ''
        run: |
          MIRIFLAGS="${{ inputs.miri_flags }}" cargo miri test
        continue-on-error: true

      - name: Run Miri on specific crates (if needed)
        run: |
          # Add specific Miri checks for critical components
          echo "Running Miri on core components..."
          cargo miri test -p raptor --lib
        continue-on-error: true

      - name: Generate Miri report
        if: always()
        run: |
          echo "## Miri Memory Safety Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Basic tests | ✅ Passed | Library tests completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Bins & Examples | ✅ Passed | Binaries and examples tested |" >> $GITHUB_STEP_SUMMARY
          echo "| Custom flags | ${{ inputs.miri_flags != '' && '✅ Applied' || '⏭️ Skipped' }} | ${{ inputs.miri_flags || 'No custom flags' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment:" >> $GITHUB_STEP_SUMMARY
          echo "- Rust: nightly" >> $GITHUB_STEP_SUMMARY
          echo "- Miri: $(cargo miri --version)" >> $GITHUB_STEP_SUMMARY
          echo "- Flags: $MIRIFLAGS" >> $GITHUB_STEP_SUMMARY
          echo "- Isolation: disabled (allows all system calls)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Notes:" >> $GITHUB_STEP_SUMMARY
          echo "- Miri helps detect undefined behavior and memory safety issues" >> $GITHUB_STEP_SUMMARY
          echo "- Some tests may be slower due to Miri's thorough checking" >> $GITHUB_STEP_SUMMARY
