[package]
name = "raptor-benches"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
raptor = { path = "../raptor" }
criterion = "0.5.1"
tokio = { version = "1.37.0", features = ["full"] }
futures = "0.3"
rand = { version = "0.8", features = ["std_rng"] }
fastrand = "2.0"

[[bench]]
name = "allocator_benchmark"
path = "src/benches/allocator_benchmark.rs"
harness = false

[[bench]]
name = "commands_set_benchmark"
path = "src/benches/commands/set_benchmark.rs"
harness = false

[[bench]]
name = "commands_get_benchmark"
path = "src/benches/commands/get_benchmark.rs"
harness = false

[[bench]]
name = "commands_mset_benchmark"
